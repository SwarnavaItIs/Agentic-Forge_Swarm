    uid: forgeswarm-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: ForgeSwarm Jaeger
    uid: forgeswarm-jaeger
    type: jaeger
