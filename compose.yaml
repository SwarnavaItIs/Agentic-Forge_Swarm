name: forgeswarm-dev
services:
  db:
    image: postgres:17.11-bookworm@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
    platform: linux/amd64
    environment:
      POSTGRES_USER: forgeswarm
      POSTGRES_PASSWORD: forgeswarm_dev
      POSTGRES_DB: forgeswarm
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeswarm -d forgeswarm"]
      interval: 2s
      timeout: 2s
      retries: 30
  broker:
    profiles: ["execution"]
    image: nats:2.11.6-alpine@sha256:7dec3f8f1ff181975dbdfc0d903d2a9724659648294dbc2ebb2fa3a294d573a6
    platform: linux/amd64
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      # Public development default, reachable only through loopback host ports.
      NATS_TOKEN: ${NATS_TOKEN:-forgeswarm-development-broker-token}
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./config/nats.conf:/etc/nats/nats.conf:ro
      - dev-broker:/data
volumes:
  dev-db:
  dev-broker:
